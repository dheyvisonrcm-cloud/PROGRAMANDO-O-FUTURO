<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RecGo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--f:'Plus Jakarta Sans',system-ui,sans-serif;--sand:#f5efe0;--or:#de581e;--pe:#005570;--nv:#001d2d;--tx:#07171e;--bl:#0d4f68;--mu:#628094;--cd:#fffdf9;--bd:#dfc7b7;--ln:#f0e7dd;--gr:#2b7245;--gd:#e8b04a}
*{box-sizing:border-box}button,input{font-family:inherit}
body{margin:0;background:#e9e1cf;font:400 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx)}
#app{max-width:390px;min-height:100vh;margin:auto;background:var(--sand);position:relative;padding:4px 0 100px;border-top:4px solid var(--pe)}
@media(min-width:430px){#app{margin:16px auto;min-height:844px;border-radius:28px;border:1px solid #0d4f69;border-top:4px solid var(--pe);overflow:hidden}}
h1,h2,h3,p{margin:0}h1{font:700 22px/26px var(--f);color:var(--nv)}h2{font:700 20px/26px var(--f)}h3{font:700 16px/22px var(--f);color:var(--nv)}
.pad{padding:0 24px}.mu{color:var(--mu);font-size:12px}.eb{font:700 10px/1.3 var(--f);color:var(--or);letter-spacing:.05em;text-transform:uppercase}
.hd{display:flex;justify-content:space-between;align-items:center;margin:0 24px;padding:12px 0 8px;border-bottom:1px solid var(--ln)}
.hd a,.lnk{color:var(--pe);font-weight:700;font-size:11px;background:none;border:0;cursor:pointer;font-family:inherit}
.wm{font:800 22px/1 var(--f);color:var(--pe)}.wm i{font-style:normal;color:var(--or)}.hd img{height:27px}
.art{position:relative;overflow:hidden;background:linear-gradient(160deg,#2c8a8f,#e8b04a);border:3px solid var(--gd);border-radius:60px 60px 10px 10px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.w{border-radius:18px;height:200px;margin:12px 20px}
.foot{height:92px;margin-top:28px;background:radial-gradient(90px 46px at 12% 100%,#2c8a8f 96%,#0000),radial-gradient(120px 54px at 62% 100%,#8fc1b8 96%,#0000),radial-gradient(70px 60px at 94% 100%,#de9a5a 96%,#0000)}
.foot img{width:100%;height:100%;object-fit:cover;display:block}
.f{margin:0 0 14px}.f label{display:block;font-weight:700;font-size:12px;color:var(--nv);margin-bottom:6px}
.f div{position:relative}.f span{position:absolute;left:15px;top:15px;font-size:12px}
.f input{width:100%;height:52px;padding:0 60px 0 41px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);font:inherit;color:var(--tx)}
.f button{position:absolute;right:14px;top:17px;border:0;background:none;color:var(--pe);font:700 11px var(--f);cursor:pointer}
input:focus,button:focus-visible{outline:3px solid var(--pe);outline-offset:2px}
.btn{display:block;width:100%;height:52px;border:0;border-radius:12px;background:var(--or);color:#fff;font:700 16px var(--f);cursor:pointer;box-shadow:0 3px 0 var(--pe);margin-top:12px}
.btn.g{background:var(--cd);color:var(--nv);border:1px solid var(--bd);box-shadow:none}.btn:disabled{opacity:.6}
.ok{display:flex;gap:10px;align-items:center;background:#f1f3e8;border:1px solid #d5e1cd;border-radius:8px;padding:12px;font:700 11px/16px var(--f);color:var(--pe);margin-top:18px}
.ok b{background:var(--gr);color:#fff;border-radius:50%;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px}
.row{display:flex;gap:8px;align-items:center;padding:0 24px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:20px;border:1.5px solid var(--or);background:var(--cd);color:var(--or);font:700 12px var(--f);cursor:pointer}
.chip.on{background:var(--or);color:#fff}.chip.s{border-color:var(--bd);color:var(--nv)}
.q{flex:1;height:36px;border:1px solid var(--bd);border-radius:18px;background:var(--cd);padding:0 14px;font:inherit}
#map{height:330px;margin:12px 16px 0;border-radius:18px;border:1px solid var(--bd);box-shadow:0 2px 8px #0002}
.pin i{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pe);border:2px solid #fff;box-shadow:0 2px 5px #0005}.pin.n i{background:var(--or)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 24px 10px}
.sh{display:flex;gap:12px;margin:12px 16px 0;padding:10px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;box-shadow:0 2px 8px #0002}
.sh .art{width:72px;min-height:112px;border-radius:36px 36px 8px 8px;flex:none}
.tg{display:inline-block;padding:3px 10px;border-radius:12px;border:1.5px solid var(--pe);color:var(--bl);font:600 11px var(--f);text-transform:uppercase}
.tg.o{background:#fde9de;border-color:#f3c3a8;color:var(--or)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 0}
.bk{border:0;background:none;font:600 16px var(--f);color:var(--tx);cursor:pointer;padding:0}
.xp{font:700 13px var(--f);color:var(--bl)}
.bar{height:6px;border-radius:4px;background:#eadfca;margin:8px 0 4px}.bar i{display:block;height:100%;border-radius:4px;background:var(--or)}
.lore{margin:14px 24px;font-size:14px;line-height:20px;color:var(--bl)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:8px;height:8px;border-radius:50%;background:#e1d5bd}.dots .on{background:var(--or)}
.big{font:800 44px/1 var(--f);color:var(--or);text-align:center;margin:4px 0}
.med{width:42px;height:42px;border-radius:50%;background:var(--cd);border:2px solid var(--gd);display:grid;place-items:center;overflow:hidden;font-size:20px;flex:none}.med img{width:100%;height:100%;object-fit:cover}
.lv{display:flex;gap:12px;align-items:center;margin:14px 24px;padding:14px;background:var(--cd);border:1px solid var(--bd);border-radius:14px}.lv>div{flex:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 24px}
.st{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;text-align:center;font-size:11px;color:var(--mu)}.st b{display:block;font-size:24px;color:var(--or)}
.sc{display:flex;justify-content:space-between;align-items:baseline;padding:22px 24px 10px}
.selo{text-align:center;font:600 11px/14px var(--f)}.selo .med{margin:0 auto 6px;width:56px;height:56px}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--ln)}.li:first-child{border:0}
.rd{margin:12px 24px;padding:14px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--gd)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:8px 0 max(10px,env(safe-area-inset-bottom));z-index:500}
nav button{flex:1;border:0;background:none;font:600 12px var(--f);color:var(--mu);padding:4px;cursor:pointer}nav b{display:block;font-size:22px;font-weight:400}nav .on{color:var(--or)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--nv);color:#fff;padding:11px 16px;border-radius:12px;max-width:340px;z-index:9999;font-weight:600;display:none}
#load{position:fixed;inset:0;background:#f5efe0ee;display:none;place-items:center;text-align:center;z-index:9998;font-weight:600}
#reader{border-radius:14px;overflow:hidden;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="alert"></div>
<div id="load"><div><div style="font-size:42px">🌴</div>Acordando o servidor…<br><span class="mu">Na primeira visita pode levar alguns segundos.</span></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API='https://programando-o-futuro-6zpg.onrender.com';
/* Ilustrações do Figma: exporte e salve em /assets (nomes abaixo). Sem o arquivo, entra um degradê. */
const IMG={logo:'assets/logo.png',arco:'assets/arco-olinda.png',rodape:'assets/rodape.png',mon:id=>`assets/monumentos/${id}.jpg`,selo:id=>`assets/selos/${id}.png`};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tok=localStorage.getItem('access_token')||sessionStorage.getItem('access_token'),me=null,mons=[],favs=new Set(),pos=null,map=null,um=null,qr=null,cur=null,story=null,layer=1,near=false,fl=0;
const lvl=p=>Math.floor(p/100)+1,nm=m=>m.nome_monumento||m.nome,ds=m=>m.descricao_monumento||m.descricao||'';
const hav=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const dist=m=>pos&&m.latitude!=null?hav(pos[0],pos[1],+m.latitude,+m.longitude):null;
const fmt=d=>d==null?'':d<1000?'~'+Math.round(d)+' m · em linha reta':'~'+(d/1000).toFixed(1)+' km';
const art=(src,c='')=>`<div class="art ${c}"><img src="${src}" alt="" onerror="this.remove()"></div>`;
const foot=()=>`<div class="foot"><img src="${IMG.rodape}" alt="" onerror="this.remove()"></div>`;
const logo=()=>`<img src="${IMG.logo}" alt="OlindaGO" onerror="this.outerHTML='<b class=wm>Olinda<i>GO</i></b>'">`;
const hd=r=>`<div class="hd">${logo()}${r||''}</div>`;
const xpBar=p=>`<div class="bar"><i style="width:${p%100}%"></i></div><span class="mu">Mais ${100-p%100} XP para o nível ${lvl(p)+1}</span>`;
const lvCard=(p,t)=>`<div class="lv"><div class="med">★</div><div><b>Nível ${lvl(p)} · ${t||'Olhar atento'}</b>${xpBar(p)}</div><span class="mu">${p%100}/100</span></div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3800)}
const load=v=>$('#load').style.display=v?'grid':'none';
function out(){stopQr();tok=me=null;localStorage.removeItem('access_token');sessionStorage.removeItem('access_token');auth('login')}
async function api(p,o={}){
  const t=setTimeout(()=>load(1),1500);
  try{
    const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})}});
    clearTimeout(t);load(0);let d=null;try{d=await r.json()}catch(e){}
    if((r.status==401||r.status==403)&&tok&&p!='/login'){out();throw new Error('Sessão expirada. Entre novamente.')}
    if(!r.ok)throw new Error(typeof d?.detail=='string'?d.detail:d?.detail?.[0]?.msg||'Erro '+r.status);
    return d;
  }catch(e){clearTimeout(t);load(0);throw e instanceof TypeError?new Error('Sem conexão ou servidor acordando. Tente de novo.'):e}
}
const run=f=>Promise.resolve().then(f).catch(e=>toast(e.message));
function shell(h,tab){stopQr();app.innerHTML=h+(tab?`<nav>${[['mapa','🗺️','Mapa',mapv],['conq','🏅','Conquistas',conqv],['perfil','👤','Perfil',perfilv]].map(([k,i,l,f])=>`<button class="${k==tab?'on':''}" onclick="run(${f.name})"><b>${i}</b>${l}</button>`).join('')}</nav>`:'');scrollTo(0,0)}
function stopQr(){if(qr){const q=qr;qr=null;q.stop().catch(()=>{})}}

/* 01 Cadastro e 02 Login */
function auth(m){
  const c=m=='cad';
  shell(`${hd(c?'<button class="lnk" onclick="auth(\'login\')">Já tem conta?</button>':'<button class="lnk" onclick="toast(\'Ajuda em breve.\')">Ajuda</button>')}
  <div class="pad" style="padding-top:24px"><div style="display:flex;justify-content:space-between;gap:12px"><div><p class="eb">${c?'Sua primeira camada':'Sua próxima camada'}</p>
  <h1 style="margin-top:8px">${c?'Olinda tem muito<br>para você descobrir.':'Que bom ter você<br>de volta.'}</h1><p class="mu" style="margin-top:12px;max-width:222px;font-size:12px;line-height:19px">${c?'Crie sua conta e guarde cada descoberta.':'Entre para continuar descobrindo a cidade.'}</p></div>${art(IMG.arco,'')} </div>
  <form id="f" style="margin-top:22px">${c?'<div class="f"><label>Nome</label><div><span>👤</span><input name="nome" placeholder="Como você quer ser chamado?" required></div></div>':''}
  <div class="f"><label>E-mail</label><div><span>✉️</span><input name="email" type="email" placeholder="voce@email.com" required></div></div>
  <div class="f"><label>Senha</label><div><span>🔒</span><input name="senha" id="pw" type="password" placeholder="${c?'Crie uma senha (6 a 72 caracteres)':'Digite sua senha'}" ${c?'minlength="6" maxlength="72"':''} required><button type="button" onclick="pw.type=pw.type=='password'?'text':'password'">Ver</button></div></div>
  ${c?'':'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mu)"><label><input type="checkbox" id="keep" checked> Manter conectado</label><button type="button" class="lnk" style="color:var(--or);font-size:10px" onclick="toast(\'Recuperação de senha em breve.\')">Esqueci minha senha</button></div>'}
  <button class="btn">${c?'Criar conta':'Entrar &nbsp;→'}</button></form>
  ${c?'':'<p class="mu" style="text-align:center;margin:18px 0 12px;font-size:10px">ou continue com</p><button class="btn g" disabled>G &nbsp;Google (em breve)</button>'}
  <p class="mu" style="text-align:center;margin-top:18px;font-size:11px">${c?'Já tem uma conta? <button class="lnk" style="color:var(--or)" onclick="auth(\'login\')">Entre para continuar.</button>':'Ainda não tem uma conta? <button class="lnk" style="color:var(--or)" onclick="auth(\'cad\')">Criar conta</button>'}</p>
  <div class="ok"><b>✦</b>Suas histórias e conquistas ficam guardadas no seu perfil.</div></div>${foot()}`);
  $('#f').onsubmit=e=>{e.preventDefault();run(async()=>{
    const d=Object.fromEntries(new FormData(e.target));
    if(c)await api('/cadastrar',{method:'POST',body:JSON.stringify(d)});
    const r=await api('/login',{method:'POST',body:JSON.stringify({email:d.email,senha:d.senha})});
    tok=r.access_token;(c||$('#keep')?.checked?localStorage:sessionStorage).setItem('access_token',tok);me=null;await mapv()})};
}

/* 03 Mapa */
async function mapv(){
  me=await api('/usuarios/me');if(!mons.length)mons=await api('/monumentos');
  shell(`${hd(`<span class="xp">Nível ${lvl(me.pontos_totais)} · ${me.pontos_totais} XP</span>`)}
  <div class="row" style="justify-content:space-between;padding-top:14px"><div><h2 style="font-size:22px;color:var(--nv)">Olá, ${esc(me.nome)}!</h2><p class="mu">Que camada você vai descobrir?</p></div><button class="chip ${near?'on':''}" onclick="nearMe()">📍 Perto de mim</button></div>
  <div class="row" style="margin-top:12px"><input class="q" id="q" placeholder="🔍 Buscar lugar" oninput="busca()"><button class="chip s" id="tg" onclick="tgl()">Lista</button></div>
  <div id="map"></div><div id="lst" hidden style="padding-top:12px"></div><div id="sel"></div>`,'mapa');
  map=L.map('map',{zoomControl:true}).setView([-8.04,-34.88],12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  um=null;const pts=[];
  mons.forEach((m,i)=>{if(m.latitude==null||m.longitude==null)return;const ll=[+m.latitude,+m.longitude],d=dist(m);pts.push(ll);
    L.marker(ll,{icon:L.divIcon({className:'pin'+(d!=null&&d<=200?' n':''),html:'<i></i>',iconSize:[26,26],iconAnchor:[13,26]})}).on('click',()=>sel(i)).addTo(map)});
  if(pts.length)map.fitBounds(pts,{padding:[30,30]});
  lista();gps();sel(prox());
}
function prox(){let b=0,bd=1e12;mons.forEach((m,i)=>{const d=dist(m);if(d!=null&&d<bd){bd=d;b=i}});return b}
function gps(){if(!navigator.geolocation||gps.on)return;gps.on=1;
  navigator.geolocation.watchPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];
    if(map&&$('#map')){um?um.setLatLng(pos):um=L.circleMarker(pos,{radius:8,color:'#fff',weight:3,fillColor:'#2a6df4',fillOpacity:1}).addTo(map);lista()}},()=>{},{enableHighAccuracy:true})}
function lista(){const l=$('#lst');if(!l)return;const q=($('#q').value||'').toLowerCase();
  let a=mons.map((m,i)=>({m,i,d:dist(m)})).filter(x=>nm(x.m).toLowerCase().includes(q));
  if(near)a=a.filter(x=>x.d!=null).sort((x,y)=>x.d-y.d);
  l.innerHTML=a.map(({m,i,d})=>`<div class="cd" onclick="run(()=>pv(${i}))"><b>${esc(nm(m))}</b><br><span class="mu">${esc(m.cidade||'')} ${fmt(d)}${d!=null&&d<=200?' · você está aqui':''}</span></div>`).join('')||'<p class="pad mu">Nenhum lugar encontrado.'+(near?' Ative o GPS para ver os lugares perto de você.':'')+'</p>'}
function busca(){lista();if($('#lst').hidden)tgl(1)}
function sel(i){const m=mons[i];if(!m)return;const d=dist(m);$('#sel').innerHTML=`<div class="sh">${art(IMG.mon(m.id_monumento))}<div style="flex:1"><div style="display:flex;justify-content:space-between"><b style="font-size:12px;color:var(--bl)">Próxima descoberta</b><span class="mu" style="font-size:10px">${fmt(d)}</span></div><h2 style="font-size:20px;margin:6px 0 2px">${esc(nm(m))}</h2><p class="mu">${esc(m.cidade||'História, vistas e novas camadas.')}</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="tg o">+ Novo local</span><button class="lnk" style="font-size:12px" onclick="run(()=>pv(${i}))">Ver local →</button></div></div></div>`}
function nearMe(){if(!pos)return toast('Ative a localização do aparelho para usar “Perto de mim”.');near=!near;mapv().then(()=>{if(near){map.flyTo(pos,17);tgl(1)}}).catch(e=>toast(e.message))}
function tgl(on){const l=$('#lst'),m=$('#map'),s=on||l.hidden;l.hidden=!s;m.hidden=s;$('#sel').hidden=s;$('#tg').textContent=s?'Mapa':'Lista';if(!s)map.invalidateSize()}

/* 04 Prévia do local */
async function pv(i){
  cur=mons[i];if(!pv.f){favs=new Set((await api('/favoritos')).map(f=>f.id_monumento));pv.f=1}
  shell(`<div class="top"><button class="bk" onclick="run(mapv)">‹ Mapa</button><span style="font-size:12px;color:var(--bl)">Detalhe do local</span><button class="lnk" aria-label="Favoritar" id="hr" style="font-size:20px" onclick="run(fav)">${favs.has(cur.id_monumento)?'❤️':'🤍'}</button></div>
  ${art(IMG.mon(cur.id_monumento),'w')}
  <div class="pad"><span class="tg o">+ Novo local</span> <span class="tg">${esc(cur.cidade||'Cultura & memória')}</span>
  <h1 style="margin:12px 0 6px">${esc(nm(cur))}</h1><p style="color:var(--bl);font-size:13px;line-height:20px">${esc(ds(cur))||'Um lugar cheio de histórias esperando por você.'}</p>
  <div style="display:flex;justify-content:space-between;margin:14px 0;font-size:12px"><span class="mu">⏱ 3 min · 1 missão</span><b class="xp" style="color:var(--or)">+${cur.pontos||10} XP possíveis</b></div>
  <div class="cd" style="margin:0"><b>Sua exploração começa aqui</b><div class="bar"><i style="width:8%"></i></div></div>
  <button class="btn" onclick="run(()=>storyv(0))">Começar descoberta &nbsp;→</button>
  <p class="mu" style="text-align:center;margin-top:12px;font-size:11px">Você pode explorar sem compartilhar sua localização exata.</p></div>${foot()}`);
}
async function fav(){const id=cur.id_monumento,h=favs.has(id);await api('/favoritos/'+id,{method:h?'DELETE':'POST'});h?favs.delete(id):favs.add(id);$('#hr').textContent=h?'🤍':'❤️'}

/* 05 História */
async function storyv(more){
  try{story=await api(`/monumentos/${cur.id_monumento}/narrativa${more&&story?'?excluir='+story.id_narrativa_monumento:''}`)}catch(e){return toast(e.message)}
  layer=more?(layer%story.total_variantes)+1:1;const n=story.total_variantes;
  shell(`<div class="top"><button class="bk" onclick="run(()=>pv(mons.indexOf(cur)))">‹ Sair</button><b style="font-size:12px;color:var(--bl)">${esc(nm(cur)).toUpperCase()}</b><span class="mu">${layer}/${n}</span></div>
  <div class="pad" style="margin-top:14px"><span class="tg">Camada ${layer} · Origens</span></div>${art(IMG.mon(cur.id_monumento),'w')}
  <div class="pad"><p class="eb" style="color:var(--bl)">Olhe de novo para o lugar</p><h2 style="margin:6px 0 8px;color:var(--nv)">Uma história que o lugar conta</h2></div>
  <p class="lore" style="margin-top:0">${esc(story.texto_narrativa)}</p>
  <div class="cd" onclick="run(salvar)" style="cursor:pointer;display:flex;justify-content:space-between"><b>🔖 Salvar no diário</b><span>+</span></div>
  <div class="dots">${Array.from({length:n},(_,i)=>`<i class="${i+1==layer?'on':''}"></i>`).join('')}</div>
  <div class="pad">${n>1?'<button class="btn g" onclick="run(()=>storyv(1))">Próxima camada &nbsp;→</button>':''}<button class="btn" onclick="chal()">Ir para o desafio &nbsp;→</button></div>${foot()}`);
}
async function salvar(){await api(`/narrativas/${story.id_narrativa_monumento}/salvar`,{method:'POST'});toast('História salva no seu diário.')}

/* 06 Desafio e QR Code */
function chal(){
  shell(`<div class="top"><button class="bk" onclick="run(()=>storyv(0))">‹ História</button><span style="font-size:12px;color:var(--bl)">MISSÃO · 1/1</span><span></span></div>
  <div class="pad" style="margin-top:14px"><span class="tg">Missão · Observe o lugar</span></div>${art(IMG.mon(cur.id_monumento),'w')}
  <div class="pad"><h2 style="color:var(--tx)">${esc(story.desafio||'Observe o lugar com calma e encontre um detalhe que só você notou.')}</h2><p style="color:var(--bl);font-size:12px;margin-top:8px">Faça com calma. Errar faz parte da descoberta.</p>
  <button class="btn" id="ok" onclick="$('#ok').hidden=true;$('#qb').hidden=false">Concluí o desafio</button>
  <div id="qb" hidden><div class="rd"><b>Quase lá!</b><p style="color:var(--bl);font-size:12px">Agora registre a descoberta: aponte a câmera para o QR Code do local ou digite o código.</p></div>
  <button class="btn" onclick="scan()">Ler QR Code com a câmera</button><div id="reader"></div>
  <input class="q" id="cod" placeholder="Ou digite o código do local" style="width:100%;height:48px;margin-top:12px"><button class="btn g" onclick="run(()=>resg($('#cod').value.trim()))">Validar código</button></div>
  <p class="mu" style="text-align:center;margin-top:14px;font-size:11px">Dica: você pode voltar à história a qualquer momento.</p></div>${foot()}`);
}
function scan(){stopQr();qr=new Html5Qrcode('reader');
  qr.start({facingMode:'environment'},{fps:10,qrbox:220},t=>{stopQr();run(()=>resg(t))}).catch(()=>{qr=null;toast('Não foi possível abrir a câmera. Digite o código manualmente.')})}
async function resg(code){if(!code)return toast('Informe o código do QR Code.');
  const r=await api('/conquistas/resgatar',{method:'POST',body:JSON.stringify({qrcode_hash:code})});me=await api('/usuarios/me');reward(r)}

/* 07 Recompensa */
function reward(r){
  const ms=(r.missoes_concluidas||[]).map(m=>`<div class="rd">🏆 Missão concluída: <b>${esc(m.titulo||m.nome||m)}</b>${m.pontos_recompensa?` · +${m.pontos_recompensa} XP`:''}</div>`).join('');
  shell(`${hd()}<div style="text-align:center;padding:16px 24px 0"><span class="tg o">Nova camada descoberta</span><h1 style="font-size:28px;line-height:36px;margin:10px 0 6px">Muito bem, ${esc(me.nome)}!</h1><p class="mu" style="font-size:13px">Você acabou de descobrir uma nova história de Olinda.</p>
  ${r.brinde_desbloqueado?`<div class="med" style="width:110px;height:110px;margin:18px auto 8px;font-size:48px">🏅</div><h3>${esc(r.brinde_desbloqueado)}</h3>`:'<div class="med" style="width:110px;height:110px;margin:18px auto;font-size:48px">⭐</div>'}</div>
  <div class="cd" style="text-align:center"><span class="eb" style="color:var(--bl)">Pontos conquistados</span><div class="big">+${r.pontos_ganhos} XP</div><span class="mu">Missão concluída · camada registrada</span></div>${ms}
  <div class="pad"><div style="display:flex;justify-content:space-between;font-size:12px"><b>Próximo nível</b><span class="mu">${me.pontos_totais} / ${lvl(me.pontos_totais)*100} XP</span></div><div class="bar"><i style="width:${me.pontos_totais%100}%"></i></div>
  <button class="btn" onclick="run(mapv)">Voltar ao mapa</button><button class="btn g" onclick="run(conqv)">Ver minhas conquistas &nbsp;→</button><p class="mu" style="text-align:center;margin-top:12px;font-size:11px">Seu progresso fica salvo no seu perfil.</p></div>`);
}

/* 08 Conquistas */
async function conqv(){
  const[u,ms,ts]=await Promise.all([api('/usuarios/me'),api('/missoes'),api('/trilhas')]);me=u;
  const pg=await Promise.all(ts.map(t=>api(`/trilhas/${t.id_trilha}/progresso`).catch(()=>null)));const bs=u.brindes||[];
  shell(`<div class="hd" style="border:0"><h2 style="color:var(--nv)">Minhas conquistas</h2><button class="med" style="width:28px;height:28px;font:700 13px var(--f);border:0;background:var(--or);color:#fff" onclick="run(perfilv)">${esc(u.nome[0]||'?').toUpperCase()}</button></div>
  <div class="pad"><p class="eb" style="color:var(--bl)">Seu caminho por Olinda</p><h1 style="margin:4px 0">Cada lugar deixa uma marca.</h1><p class="mu" style="font-size:13px">Você está construindo sua própria coleção.</p></div>${lvCard(u.pontos_totais)}
  <div class="pad"><h3>Seu percurso</h3></div><div class="g3" style="margin-top:10px"><div class="st"><b>${u.monumentos_conquistados}</b>Lugares visitados</div><div class="st"><b>${bs.length}</b>Selos</div><div class="st"><b>${u.pontos_totais}</b>XP conquistados</div></div>
  <div class="sc"><h3>Selos colecionados</h3></div><div class="g3">${bs.map(b=>`<div class="selo"><div class="med"><img src="${esc(b.imagem_url||IMG.selo(b.brinde_id))}" alt="" onerror="this.outerHTML='🏅'"></div>${esc(b.nome_brinde)}</div>`).join('')||'<p class="mu" style="grid-column:1/-1">Visite um lugar e leia o QR Code para ganhar seu primeiro selo.</p>'}</div>
  <div class="sc"><h3>Missões</h3></div>${ms.map(m=>`<div class="cd"><b>${m.concluida?'✅ ':''}${esc(m.titulo)}</b> <span class="tg o">+${m.pontos_recompensa} XP</span><p class="mu" style="margin-top:4px">${esc(m.descricao_missao)}</p><div class="bar"><i style="width:${m.total?Math.round(100*m.progresso/m.total):0}%"></i></div><span class="mu">${m.progresso}/${m.total}</span></div>`).join('')}
  <div class="sc"><h3>Trilhas</h3></div>${ts.map((t,i)=>{const p=pg[i];return `<div class="cd"><b>${esc(t.nome_trilha)}</b><p class="mu" style="margin-top:4px">${esc(t.descricao_trilha||'')}</p>${p?`<div class="bar"><i style="width:${Math.round(100*p.etapas_concluidas/p.total_etapas)}%"></i></div><span class="mu">${p.etapas_concluidas}/${p.total_etapas}${p.proximo_monumento?' · próximo: '+esc(p.proximo_monumento.nome_monumento):' · trilha concluída'}</span>`:`<button class="btn g" style="height:42px;margin-top:10px" onclick="run(()=>ini(${t.id_trilha}))">Iniciar trilha</button>`}</div>`}).join('')}`,'conq');
}
async function ini(id){await api(`/trilhas/${id}/iniciar`,{method:'POST'});toast('Trilha iniciada!');await conqv()}

/* 09 Perfil */
async function perfilv(){
  const[u,fv,sv]=await Promise.all([api('/usuarios/me'),api('/favoritos'),api('/narrativas/salvas')]);me=u;
  const opt=[['👤','Meus dados','Nome, e-mail e senha'],['🔒','Privacidade e localização','Controle o que você compartilha'],['♿','Acessibilidade','Preferências de leitura e interface'],['❔','Ajuda e sobre o RecGo','Suporte e informações do app']];
  shell(`<div class="hd" style="border:0"><h2 style="color:var(--nv)">Meu perfil</h2></div>
  <div style="text-align:center"><div class="med" style="width:88px;height:88px;margin:4px auto 10px;font:800 38px var(--f);color:var(--pe);border-width:3px;border-radius:44px 44px 12px 12px">${esc(u.nome[0]||'?').toUpperCase()}</div><p class="eb" style="color:var(--bl)">Explorador(a) de Olinda</p><h1 style="margin-top:4px">${esc(u.nome)}</h1><p class="mu">${esc(u.email)}</p></div>
  ${lvCard(u.pontos_totais)}<div class="g3"><div class="st"><b>${u.monumentos_conquistados}</b>Lugares</div><div class="st"><b>${sv.length}</b>Histórias</div><div class="st"><b>${(u.brindes||[]).length}</b>Selos</div></div>
  <div class="sc"><h3>Favoritos</h3></div><div class="pad">${fv.map(f=>`<div class="li">❤️ ${esc(f.nome_monumento)}</div>`).join('')||'<p class="mu">Toque no coração de um lugar para guardá-lo aqui.</p>'}</div>
  <div class="sc"><h3>Histórias salvas</h3></div>${sv.map(s=>`<div class="cd"><b>${esc(s.nome_monumento)}</b><p style="color:var(--bl);font-size:13px;margin-top:4px">${esc(s.texto_narrativa)}</p><span class="mu">${esc(s.desafio||'')}</span></div>`).join('')||'<p class="pad mu">Salve uma história no diário para relê-la depois.</p>'}
  <div class="sc"><h3>Conta e preferências</h3></div><div class="pad">${opt.map(([i,t,s])=>`<div class="li" onclick="toast('Em breve.')"><span class="med" style="width:26px;height:26px;font-size:12px;border-width:1px">${i}</span><div style="flex:1"><b style="font-size:13px">${t}</b><br><span class="mu" style="font-size:11px">${s}</span></div>›</div>`).join('')}</div>
  <div class="pad"><p class="mu" style="margin:14px 0;font-size:11px">Sua localização é opcional. Você pode explorar sem compartilhar sua posição exata.</p><button class="btn g" onclick="out()">Sair</button><p class="mu" style="text-align:center;margin-top:12px;font-size:10px">RecGo · Uma cidade, muitas camadas.</p></div>`,'perfil');
}

run(async()=>{if(!tok)return auth('login');try{await mapv()}catch(e){if(tok)toast(e.message);else auth('login')}});
</script>
</body>
</html>
