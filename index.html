<!-- SEÇÃO DE AUTENTICAÇÃO -->
<section id="authSection" class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
    
    <!-- Botões de Alternância com clique direto -->
    <div class="flex border-b border-gray-700 mb-6">
        <button type="button" 
                onclick="document.getElementById('registerForm').classList.remove('hidden'); document.getElementById('loginForm').classList.add('hidden'); this.className='flex-1 py-3 text-center font-bold text-blue-400 border-b-2 border-blue-400 cursor-pointer'; document.getElementById('tabLoginBtn').className='flex-1 py-3 text-center font-bold text-gray-400 border-b-2 border-transparent cursor-pointer';" 
                id="tabRegisterBtn" 
                class="flex-1 py-3 text-center font-bold text-gray-400 border-b-2 border-transparent cursor-pointer">
            Cadastrar
        </button>
        
        <button type="button" 
                onclick="document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('registerForm').classList.add('hidden'); this.className='flex-1 py-3 text-center font-bold text-blue-400 border-b-2 border-blue-400 cursor-pointer'; document.getElementById('tabRegisterBtn').className='flex-1 py-3 text-center font-bold text-gray-400 border-b-2 border-transparent cursor-pointer';" 
                id="tabLoginBtn" 
                class="flex-1 py-3 text-center font-bold text-blue-400 border-b-2 border-blue-400 cursor-pointer">
            Login
        </button>
    </div>

    <!-- Formulário Cadastro -->
    <form id="registerForm" class="space-y-4 hidden">
        <div>
            <label class="text-xs text-gray-400 block mb-1">Nome Completo</label>
            <input type="text" id="regNome" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="text-xs text-gray-400 block mb-1">E-mail</label>
            <input type="email" id="regEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="text-xs text-gray-400 block mb-1">Senha</label>
            <input type="password" id="regSenha" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" id="btnRegister" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition cursor-pointer">Criar Conta</button>
    </form>

    <!-- Formulário Login -->
    <form id="loginForm" class="space-y-4">
        <div>
            <label class="text-xs text-gray-400 block mb-1">E-mail</label>
            <input type="email" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="text-xs text-gray-400 block mb-1">Senha</label>
            <input type="password" id="loginSenha" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition cursor-pointer">Entrar</button>
    </form>
</section>
