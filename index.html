        <section id="authSection" class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
            <div class="flex border-b border-gray-700 mb-4">
                <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 font-semibold text-blue-400 border-b-2 border-blue-400">Login</button>
                <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 font-semibold text-gray-400">Cadastrar</button>
            </div>

            <!-- Form Cadastro -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="text-xs text-gray-400">Nome Completo</label>
                    <input type="text" id="regNome" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">E-mail</label>
                    <input type="email" id="regEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Senha</label>
                    <input type="password" id="regSenha" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">Criar Conta</button>
            </form>

            <!-- Form Login -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400">E-mail</label>
                    <input type="email" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Senha</label>
                    <input type="password" id="loginSenha" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">Entrar</button>
            </form>
        </section>
